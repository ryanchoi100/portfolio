<!DOCTYPE html>
<!-- Seasons endless-scroll scene — standalone, dependency-free. Serve over HTTP (canvas reads image pixels; file:// will fail). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seasons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;overflow:hidden;background:var(--night-water);color:var(--lake-ink);overscroll-behavior:none}a{color:var(--lake-ink)}a:hover{color:var(--lake-ink)}</style>
<style>
/* ======================================================================
   GLASS TOKENS — extracted verbatim from the original hover label + Playground pop-up.
   Names follow DESIGN.md ("The Painted Season"); every glass surface reads these, never restated values.
   ====================================================================== */
:root {
  /* colour — names and values as in DESIGN.md frontmatter */
  --lake-ink: #141c24;                        /* all text, icons, focus outlines */
  --lake-ink-muted: rgba(20, 28, 38, 0.72);   /* secondary metadata (dates) */
  --hairline: rgba(20, 28, 38, 0.10);         /* 1px row dividers */
  --frost: rgba(255, 255, 255, 0.62);         /* standard glass: label, panel, close, buttons, chips */
  --frost-dense: rgba(255, 255, 255, 0.74);   /* glass on glass: cards, hovered rows */
  --frost-lit: rgba(255, 255, 255, 0.8);      /* hovered glass buttons (the 0.8 ceiling) */
  --frost-edge: rgba(255, 255, 255, 0.6);     /* 1px border on every glass surface */
  --dusk-scrim: rgba(20, 28, 38, 0.16);       /* wash over the scene behind a pop-up */
  /* the only accent (state responses only). Its hue follows the season: the scene sets --glow-rgb on <html>
     as the visitor scrolls (spring blossom, summer sun, autumn ember, winter frost), blending between them. */
  --glow-rgb: 255, 222, 156;
  --lamplight: rgba(var(--glow-rgb), 0.6);
  --lamplight-selection: rgba(var(--glow-rgb), 0.75);
  --night-water: #1d2630;
  --paper: #ffffff;                           /* Resume paper face */
  --paper-back: #f7f4ef;                      /* back of the folded sheet */
  --paper-back-shade: #ebe6de;
  /* type */
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  /* shape */
  --radius-glass: 9px;
  --radius-thumb: 6px;
  --radius-paper: 2px;
  --radius-media: 18px;                       /* Playground cards (large media tiles) */
  /* material: the one frost filter (never animated) and the scrim filter */
  --frost-filter: blur(10px) saturate(1.4);
  --frost-border: 1px solid var(--frost-edge);
  --scrim-filter: blur(6px) brightness(0.9);
  /* elevation — DESIGN.md shadow vocabulary */
  --frost-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.35);
  --lamplight-ring: 0 0 14px var(--lamplight);
  --shadow-resting: 0 4px 14px rgba(20, 28, 38, 0.10), var(--frost-highlight);
  --shadow-lamplit: 0 4px 14px rgba(20, 28, 38, 0.10), var(--lamplight-ring), var(--frost-highlight);
  --shadow-lifted: 0 10px 24px rgba(20, 28, 38, 0.14), 0 0 18px rgba(var(--glow-rgb), 0.55), var(--frost-highlight);
  /* motion: expo ease-out arrivals; in-out exits (close stays visible); exits faster than entrances */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-exit: cubic-bezier(0.455, 0.03, 0.515, 0.955);
  --ease-hover: ease;
  --dur-open: 300ms;
  --dur-close: 220ms;
  --dur-reveal: 280ms;
  --stagger: 35ms;
  --dur-hover: 200ms;
  --dur-press: 120ms;
}
.glass {
  background: var(--frost);
  -webkit-backdrop-filter: var(--frost-filter); backdrop-filter: var(--frost-filter);
  border: var(--frost-border); border-radius: var(--radius-glass);
  box-shadow: var(--shadow-resting); color: var(--lake-ink);
}
.glass--dense { background: var(--frost-dense); }

/* ======================================================================
   POP-UP SHELL — one scrim + panel + close button, reused by every page.
   Pages are <template data-popup-page> blocks; only their content differs.
   States: data-state="closed" | "open" | "closing" (set by openPopup / closePopup).
   ====================================================================== */
.popup {
  position: absolute; inset: 0; z-index: 20; display: grid; place-items: center;
  background: var(--dusk-scrim);
  -webkit-backdrop-filter: var(--scrim-filter); backdrop-filter: var(--scrim-filter);
  font-family: var(--font-mono); color: var(--lake-ink);
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity var(--dur-close) var(--ease-exit), visibility 0s linear var(--dur-close);
}
.popup[data-state="open"] {
  opacity: 1; visibility: visible; pointer-events: auto;
  transition: opacity var(--dur-open) var(--ease-out), visibility 0s linear 0s;
}
.popup__panel {
  position: relative; box-sizing: border-box; display: flex; flex-direction: column;
  width: max(80vw, min(calc(100vw - 24px), 560px)); max-width: 1600px;
  height: calc(100vh - 2 * max(12px, 5vh));   /* fixed panel, 5vh from top and bottom; the page body scrolls inside it */
  --panel-pad: clamp(18px, 3vw, 36px); padding: var(--panel-pad);
  user-select: text; cursor: default;
  transform: scale(0.96);
  transition: transform var(--dur-close) var(--ease-exit);
}
.popup[data-state="open"] .popup__panel { transform: scale(1); transition: transform var(--dur-open) var(--ease-out); }
.popup__bar { position: absolute; top: 12px; right: 12px; z-index: 2; width: 44px; height: 44px; }   /* holds the close button */
.popup__close {
  position: absolute; top: 0; right: 0; width: 44px; height: 44px;
  display: grid; place-items: center; padding: 0;
  font-family: inherit; font-size: 18px; line-height: 1; cursor: pointer;
  transition: box-shadow var(--dur-hover) var(--ease-hover), background-color var(--dur-hover) var(--ease-hover), transform var(--dur-press) var(--ease-out);
}
.popup__close:active { transform: scale(0.94); }
.popup :focus-visible { outline: 2px solid var(--lake-ink); outline-offset: 0; }
.popup ::selection { background: var(--lamplight-selection); color: var(--lake-ink); }

/* header + scroll body: the layout every page drops its content into */
.pop-head { display: flex; flex-direction: column; gap: 8px; padding-right: 52px; }
.pop-head h2 { margin: 0; font-size: 22px; line-height: 1.1; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
.pop-head p { margin: 0; font-size: 13px; line-height: 1.5; max-width: 56ch; text-wrap: pretty; }
.pop-scroll {
  flex: 1; min-height: 0; margin-top: 22px; padding: 4px; overflow: auto;
  overscroll-behavior: contain; touch-action: pan-y;
  scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--lake-ink) 22%, transparent) transparent;
}

/* Image placeholder (About portrait) */
.pop-thumb {
  aspect-ratio: 16/10; border-radius: var(--radius-thumb); display: grid; place-items: center;
  background: radial-gradient(120% 90% at 30% 25%, rgba(255,255,255,0.35), rgba(255,255,255,0) 60%), var(--tint);
  font-size: 10px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase;
}

/* Shared content parts for the text pages (About, Resume, Experience) */
.pop-section + .pop-section { margin-top: 30px; }
.pop-section h3 { margin: 0 0 10px; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; }
.pop-prose p { margin: 0; font-size: 13px; line-height: 1.6; max-width: 62ch; text-wrap: pretty; }
.pop-prose p + p { margin-top: 12px; }
.pop-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }

.pop-list > li + li { border-top: 1px solid var(--hairline); }   /* hairline between rows */
/* text pages: let row hover surfaces bleed 10px past the text column without being clipped by the scroller */
.pop-scroll { margin-inline: -10px; padding-inline: 14px; }
.pop-row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 20px; align-items: baseline;
  padding: 12px 10px; margin-inline: -10px; border: 1px solid transparent; border-radius: var(--radius-glass);
  color: inherit; text-decoration: none;
  transition: background-color var(--dur-hover) var(--ease-hover), box-shadow var(--dur-hover) var(--ease-hover), border-color var(--dur-hover) var(--ease-hover);
}
a.pop-row:focus-visible { background: var(--frost-dense); border-color: var(--frost-edge); }
.pop-row__title { font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; }
.pop-row__meta { font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--lake-ink-muted); }
.pop-row__body { grid-column: 1 / -1; font-size: 12px; line-height: 1.5; max-width: 70ch; text-wrap: pretty; }
.pop-row__go { display: inline-block; margin-left: 6px; transition: transform var(--dur-hover) var(--ease-out); }
.pop-facts { display: grid; grid-template-columns: max-content 1fr; gap: 8px 22px; margin: 0; font-size: 12px; line-height: 1.5; }
.pop-facts dt { font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; }
.pop-facts dd { margin: 0; }
.pop-about { display: grid; grid-template-columns: minmax(180px, 280px) minmax(0, 1fr); gap: clamp(20px, 3vw, 40px); align-items: start; }
.pop-portrait { aspect-ratio: 4/5; --tint: rgba(158,182,160,0.42); }
.pop-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
.pop-button {
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px; box-sizing: border-box; padding: 0 16px;
  font: inherit; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--lake-ink); text-decoration: none; cursor: pointer;
  transition: box-shadow var(--dur-hover) var(--ease-hover), background-color var(--dur-hover) var(--ease-hover), transform var(--dur-press) var(--ease-out);
}
.pop-button:active { transform: scale(0.97); }
@media (max-width: 640px) {
  .pop-about { grid-template-columns: 1fr; }
  .pop-portrait { max-width: 220px; }
  .pop-facts { grid-template-columns: 1fr; gap: 2px; }
  .pop-facts dd + dt { margin-top: 10px; }
}

/* Resume bullet points inside a row */
.pop-points { grid-column: 1 / -1; margin: 4px 0 0; padding: 0 0 0 14px; font-size: 12px; line-height: 1.5; max-width: 76ch; }
.pop-points li { padding-left: 2px; text-wrap: pretty; }
.pop-points li::marker { color: var(--lake-ink-muted); }
.pop-points li + li { margin-top: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }

/* ======================================================================
   PAPER VARIANT (Resume) — the shell drops its glass sheet and shows the PDF page itself, sized so the
   whole page fits a desktop screen with no scrolling. The page is cut into 2 × 3 tiles: each half holds a
   middle tile plus a top and bottom flap. Folded: flaps over the middle (rotateX ±179°) and the right half
   over the left (rotateY −179°). unfoldPaper() animates them open with the Web Animations API.
   ====================================================================== */
.popup[data-variant="paper"] { overflow: hidden; }
.popup[data-variant="paper"] .popup__panel {
  position: absolute; inset: 0; width: auto; height: auto; max-width: none; min-height: 0; margin: 0; padding: 0;
  background: none; border: 0; border-radius: 0; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none;
  transform: none; transition: none;
}
.paper-stage {
  /* 5vh top/bottom margin like the glass panel; where the page would run under the top-right buttons
     (narrow desktop windows) it drops below them instead; phones are limited by width */
  --paper-h: min(calc(100vh - 2 * max(12px, 5vh)), calc((100vw - 32px) * 792 / 612), max(calc(100vh - 128px), calc((100vw - 600px) * 792 / 612)));
  position: absolute; inset: 0; display: grid; place-items: center; perspective: 2000px;
}
.paper-actions { position: absolute; top: 12px; right: 68px; z-index: 2; display: flex; gap: 8px; }
.paper {
  position: relative; display: block; height: var(--paper-h); aspect-ratio: 612 / 792;
  transform-style: preserve-3d; cursor: zoom-in; outline-offset: 4px;
}
.paper__shadow { position: absolute; inset: 0; border-radius: var(--radius-paper); box-shadow: 0 18px 48px rgba(20, 28, 38, 0.28), 0 3px 10px rgba(20, 28, 38, 0.16); }
.paper__shift { position: absolute; inset: 0; transform-style: preserve-3d; }
.paper__half { position: absolute; top: 0; bottom: 0; width: 50%; transform-style: preserve-3d; }
.paper__half--l { left: 0; }
.paper__half--r { left: 50%; transform-origin: 0 50%; }
.tile { position: absolute; left: 0; right: 0; height: calc(100% / 3); transform-style: preserve-3d; }
.tile--top { top: 0; transform-origin: 50% 100%; }
.tile--mid { top: calc(100% / 3); }
.tile--bot { top: calc(200% / 3); transform-origin: 50% 0; }
.tile__front, .tile__back { position: absolute; inset: 0; -webkit-backface-visibility: hidden; backface-visibility: hidden; }
.tile__front { background-color: var(--paper); background-image: url("resume/resume-page.webp"); background-size: 200% 300%; background-repeat: no-repeat; }
.tile__back { transform: rotateY(180deg); background: linear-gradient(160deg, var(--paper-back), var(--paper-back-shade)); box-shadow: inset 0 0 0 1px rgba(20, 28, 38, 0.06); }
.tile__shade { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(20, 28, 38, 0.35), rgba(20, 28, 38, 0.1)); opacity: 0; pointer-events: none; }
/* ======================================================================
   EXPERIENCE — two views stacked in one grid cell of the panel. Sizes come from JS (xpLayout):
   --list-h / --proj-h = the two scrollers' heights, --shot-w / --shot-h = one image size shared by the
   list and the project figure (so the image keeps its size through the morph), --row-h = name row,
   --fig-top = where the sticky project figure rests.
   ====================================================================== */
.xp { --xp-gap: clamp(20px, 3vw, 48px); flex: 1; min-height: 0; display: grid; grid-template: minmax(0, 1fr) / minmax(0, 1fr); }
.xp-view { grid-area: 1 / 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.xp-view[data-hidden] { visibility: hidden; }
.shot {
  position: relative; overflow: hidden; box-sizing: border-box; display: grid; place-items: center; padding: 16px;
  border-radius: var(--radius-glass); text-align: center; text-wrap: balance;
  background: radial-gradient(120% 90% at 30% 25%, rgba(255,255,255,0.35), rgba(255,255,255,0) 60%), var(--tint);
  font-size: 11px; font-weight: 500; line-height: 1.45; letter-spacing: 0.08em; text-transform: uppercase;
}
.shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

/* list: names (left) travel with the images (right); the centred image's name is lit */
.popup[data-page="experience"] .popup__panel { overflow: hidden; }   /* the list bleeds to the panel's edges; clip it to the rounded glass */
.xp-view[data-xp-view="list"] { margin-block: calc(-1 * var(--panel-pad)); }
.xp-scroll {
  margin-top: 0; scroll-snap-type: y proximity; scrollbar-width: none;
  /* images appear out of the glass instead of being cut by its edges (a mask reads only alpha, so any opaque colour works) */
  -webkit-mask-image: linear-gradient(to bottom, transparent, var(--lake-ink) 14%, var(--lake-ink) 86%, transparent);
  mask-image: linear-gradient(to bottom, transparent, var(--lake-ink) 14%, var(--lake-ink) 86%, transparent);
}
.xp-scroll::-webkit-scrollbar { display: none; }
.xp-grid { display: grid; grid-template-columns: minmax(0, 1fr) var(--shot-w, 40%); gap: var(--xp-gap); }
/* the names take the middle three quarters of the height and fade out at both ends */
.xp-names-wrap {
  position: sticky; top: calc(var(--list-h, 0px) * 0.125); align-self: start; margin-top: calc(var(--list-h, 0px) * 0.125);
  height: calc(var(--list-h, 100%) * 0.75); overflow: hidden;
  -webkit-mask-image: linear-gradient(to bottom, transparent, var(--lake-ink) 22%, var(--lake-ink) 78%, transparent);
  mask-image: linear-gradient(to bottom, transparent, var(--lake-ink) 22%, var(--lake-ink) 78%, transparent);
}
.xp-names { list-style: none; margin: 0; padding: 0 0 0 4px; }
.xp-names li { height: var(--row-h, 64px); }
.xp-name, .xp-cap {
  display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 8px;
  box-sizing: border-box; width: 100%; height: 100%; padding: 0; border: 0; border-radius: var(--radius-thumb);
  background: none; font: inherit; color: inherit; text-align: left; cursor: pointer;
}
/* name and meta on one baseline, centred in the row; the meta gives way (ellipsis) when space runs out */
.xp-name { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: baseline; align-content: center; column-gap: 28px; opacity: max(var(--o, 1), var(--hov, 0)); }
.xp-name__title {
  display: block; max-width: 100%; font-size: clamp(20px, 1.9vw, 26px); font-weight: 500; line-height: 1.15; letter-spacing: -0.01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transform-origin: 0 0;
}
.xp-name__meta {
  display: block; max-width: 100%; font-size: 11px; font-weight: 500; line-height: 1; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--lake-ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: var(--m, 1);
}
.xp-name:focus-visible { --hov: 1; }
.xp-shots { display: flex; flex-direction: column; gap: var(--xp-gap); padding-block: calc((var(--list-h, 0px) - var(--shot-h, 0px)) / 2); }
.xp-shot {
  width: var(--shot-w); height: var(--shot-h); scroll-snap-align: center; cursor: pointer;
  scale: var(--s, 1);   /* set per frame by xpSync: images away from the middle sit slightly smaller */
  transition: translate 250ms var(--ease-out), box-shadow 250ms var(--ease-hover);
}
.xp-cap { display: none; }

/* project: back bar, then a scroller with the story (left) and the sticky figure (right) */
.proj-bar { display: flex; align-items: center; gap: 14px; min-height: 44px; padding-right: 52px; }
.proj-back {
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px 0 14px;
  font: inherit; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--lake-ink); cursor: pointer;
  transition: box-shadow var(--dur-hover) var(--ease-hover), background-color var(--dur-hover) var(--ease-hover), transform var(--dur-press) var(--ease-out);
}
.proj-back > span { display: inline-block; transition: transform var(--dur-hover) var(--ease-out); }
.proj-back:active { transform: scale(0.97); }
.proj-crumb { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--lake-ink-muted); }
.proj-scroll { margin-top: 14px; }
.proj-grid { display: grid; grid-template-columns: minmax(0, 1fr) var(--shot-w, 40%); gap: var(--xp-gap); }
.proj-main { min-width: 0; padding: var(--fig-top, 0px) 0 calc(var(--proj-h, 400px) * 0.45) 4px; }
.proj-head { display: flex; flex-direction: column; gap: 16px; }
.proj-title { margin: 0; font-size: clamp(26px, 3vw, 40px); font-weight: 500; line-height: 1.1; letter-spacing: -0.01em; text-wrap: balance; transform-origin: 0 0; }
.proj-kicker { margin: 0; font-size: 11px; font-weight: 500; line-height: 1; letter-spacing: 0.08em; text-transform: uppercase; color: var(--lake-ink-muted); }
.proj-lede { margin: 0; font-size: 15px; line-height: 1.6; max-width: 44ch; text-wrap: pretty; }
.proj-meta { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 20px 24px; margin: 12px 0 0; padding-top: 22px; border-top: 1px solid var(--hairline); }
.proj-meta dt { margin-bottom: 8px; font-size: 11px; font-weight: 500; line-height: 1; letter-spacing: 0.08em; text-transform: uppercase; color: var(--lake-ink-muted); }
.proj-meta dd { margin: 0; font-size: 13px; line-height: 1.45; text-wrap: pretty; }
.proj-sec { min-height: calc(var(--proj-h, 400px) * 0.5); padding-top: clamp(64px, 14vh, 128px); }
.proj-h { margin: 16px 0 28px; max-width: 22ch; font-size: clamp(20px, 2.2vw, 28px); font-weight: 500; line-height: 1.25; letter-spacing: -0.01em; text-wrap: balance; }
.proj-sec > p:not(.proj-kicker) { margin: 0; max-width: 44ch; font-size: 15px; line-height: 1.7; text-wrap: pretty; }
.proj-sec > p:not(.proj-kicker) + p { margin-top: 1.3em; }
.proj-figure { position: sticky; top: var(--fig-top, 0px); align-self: start; display: grid; width: var(--shot-w); height: var(--shot-h); margin: var(--fig-top, 0px) 0 0; transform-origin: 0 0; }
.proj-figure > .shot { grid-area: 1 / 1; opacity: 0; transform: scale(1.03); transition: opacity 450ms var(--ease-out), transform 700ms var(--ease-out); }
.proj-figure > .shot[data-on] { opacity: 1; transform: none; }

/* phones: one column; each image carries its own name, and the project figure sticks to the top as frost */
@media (max-width: 720px) {
  .xp-grid, .proj-grid { grid-template-columns: minmax(0, 1fr); }
  .xp-names-wrap { display: none; }
  .xp-scroll { scroll-snap-type: none; }
  .xp-shots { padding-block: 0 8px; gap: 28px; }
  .xp-shot { width: 100%; }
  .xp-cap { display: flex; height: auto; min-height: 44px; padding-top: 12px; }
  .proj-main { padding-top: 24px; }
  .proj-figure {
    order: -1; z-index: 1; top: -4px; width: 100%; height: var(--fig-h, 200px); margin: 0; padding: 6px; box-sizing: border-box;
    background: var(--paper-back); border-radius: var(--radius-glass); box-shadow: var(--shadow-resting);   /* opaque: the story scrolls under it */
  }
  .proj-figure > .shot { grid-area: 1 / 1; }
  .proj-sec { min-height: 0; padding-top: 56px; }
}
/* ======================================================================
   PLAYGROUND — a diagonal, endlessly looping track of cards (positions set per frame by playFrame:
   translate along the diagonal, tilt and shrink with distance from the centre). Hover = fluid glass:
   the #pg-liquid SVG filter ripples the card's rim while a season-coloured rim light follows the pointer.
   .pg-full is the full view (fills the pop-up panel); playOpen / playClose swing it in and out.
   ====================================================================== */
.popup[data-page="playground"] .popup__panel { overflow: hidden; }
.pg { position: relative; isolation: isolate; flex: 1; min-height: 0; margin: calc(-1 * var(--panel-pad)); touch-action: none; }
.pg-track {
  position: absolute; inset: 0;
  -webkit-mask-image: linear-gradient(to bottom, transparent, var(--lake-ink) 9%, var(--lake-ink) 91%, transparent), linear-gradient(to right, transparent, var(--lake-ink) 6%, var(--lake-ink) 94%, transparent);
  -webkit-mask-composite: source-in;
  mask-image: linear-gradient(to bottom, transparent, var(--lake-ink) 9%, var(--lake-ink) 91%, transparent), linear-gradient(to right, transparent, var(--lake-ink) 6%, var(--lake-ink) 94%, transparent);
  mask-composite: intersect;

}

  <!-- Fluid-glass hover for Playground cards: noise confined to a band around the card's edge (dilated alpha

       The displacement scale is eased in and out by playFrame; the noise drifts via SMIL. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">

      <feMorphology in="SourceAlpha" operator="erode" radius="22" result="inner"/>

      <feComposite in="outer" in2="innerSoft" operator="out" result="rim"/>
      <feGaussianBlur in="rim" stdDeviation="4" result="rimSoft"/>

      <feFlood flood-color="rgb(128,128,128)" result="neutral"/>
      <feComposite in="rimNoise" in2="neutral" operator="over" result="map"/>

      if (mirror) ctx.rect(OX, 706, 300, 120); else ctx.rect(OX, OY, 300, 367 - OY);
      ctx.clip();
      for (const p of this.puffs) {
        const u = p.age / p.life, r = (2.5 + 24 * Math.pow(u, 0.9)) * p.g;
        const a = k * p.k * 0.15 * Math.min(1, u / 0.04) * Math.pow(1 - u, 2.2);
        if (a < 0.002) continue;
        const y = mirror ? 1072 - p.y : p.y;
        const g = ctx.createRadialGradient(p.x, y, 0, p.x, y, r);
        g.addColorStop(0, `rgba(240,244,248,${a})`); g.addColorStop(0.45, `rgba(240,244,248,${a * 0.7})`); g.addColorStop(1, 'rgba(240,244,248,0)');
        ctx.fillStyle = g; ctx.fillRect(p.x - r, y - r, r * 2, r * 2);
      }
      ctx.restore();
    };
    draw(false, 1); draw(true, 0.4);
  }
  // ======================================================================
  // SEASON SCROLL + MAIN LOOP
  // pos/target are unbounded floats (integer = a season). Wheel and touch swipe add to target; arrow /
  // Page / Space keys step one season. After 180ms without input target eases to the nearest integer
  // (snap). pos eases toward target. Slide i is shown with a straight vertical wipe:
  // d = (i - pos) wrapped to (-2,2]; 0<d<1 → incoming slide clipped from the left by d·100%;
  // -1<d≤0 → outgoing slide underneath. Mouse drag is intentionally NOT supported.
  // ======================================================================
  pos = 0; target = 0; lastInput = 0;
  // HORIZONTAL PAN (touch) — the stage keeps its cover size; --pan-x shifts it sideways within
  // ±(stage width − screen width)/2 so the whole painting can be reached at the same proportions.
  panX = 0; panTarget = 0; panVel = 0; dragDist = 0; axis = null;
  maxPan(el) { const st = el.querySelector('[data-slide] > div'); return st ? Math.max(0, (st.offsetWidth - el.clientWidth) / 2) : 0; }
  clampPan(el, v) { const m = this.maxPan(el); return Math.max(-m, Math.min(m, v)); }
  componentDidMount() {
    const el = this.rootRef.current;
    const speed = () => (this.props.scrollSpeed ?? 1) / 900;
    this.onWheel = e => { e.preventDefault(); const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY; this.target += d * (e.deltaMode === 1 ? 30 : 1) * speed(); this.lastInput = performance.now(); };
    this.onKey = e => {
      if ((e.key === ' ' || e.key === 'Enter') && e.target.closest?.('button, a')) return; // let focused controls activate
      if (this.pgOpen) { if (e.key === 'Escape') { e.preventDefault(); if (this.play?.full) this.playClose(); else if (this.xpProject) this.closeProject(); else this.closePopup(); } else if (e.key === 'Tab') this.trapFocus(e); return; }
      if (['ArrowDown','ArrowRight','PageDown',' '].includes(e.key)) { this.target = Math.round(this.target) + 1; }
      else if (['ArrowUp','ArrowLeft','PageUp'].includes(e.key)) { this.target = Math.round(this.target) - 1; } else return;
      e.preventDefault(); this.lastInput = 0;
    };
    // Touch: each gesture locks to one axis after 6px. Where the painting is wider than the screen (phones),
    // a sideways swipe pans across it at full size and an up/down swipe steps the season. Where the whole
    // painting already fits, any swipe steps the season exactly as before (dominant axis).
    let ty = null, sx = 0, sy = 0;
    this.onDown = e => { if (e.pointerType !== 'touch') return; ty = sy = e.clientY ?? 0; this.tx = sx = e.clientX; this.axis = null; this.dragDist = 0; this.panVel = 0; el.setPointerCapture?.(e.pointerId); };
    this.onMove = e => {
      if (e.pointerType === 'mouse' || e.pointerType === 'pen') { this.mouse = { x: e.clientX, y: e.clientY }; return; }
      if (ty == null) return;
      const dy = ty - e.clientY, dx = this.tx - e.clientX; ty = e.clientY; this.tx = e.clientX;
      this.dragDist += Math.abs(dx) + Math.abs(dy);
      if (!this.axis) {
        if (Math.hypot(e.clientX - sx, e.clientY - sy) < 6) return;
        this.axis = Math.abs(e.clientX - sx) > Math.abs(e.clientY - sy) && this.maxPan(el) > 1 ? 'pan' : 'season';
      }
      if (this.axis === 'pan') { this.panTarget = this.clampPan(el, this.panTarget - dx); this.panVel = -dx; return; }
      const d = this.maxPan(el) > 1 ? dy : (Math.abs(dx) > Math.abs(dy) ? dx : dy);
      this.target += d * speed() * 2.2; this.lastInput = performance.now();
    };
    this.onUp = () => { ty = null; if (this.axis !== 'pan') this.panVel = 0; };
    // Click / tap on a scene object opens its page. The hit is resolved at the click point, so touch taps
    // (which never set this.mouse) work too; a missed tap clears the temporary point again.
    this.onClick = e => {
      if (this.dragDist > 10) { this.dragDist = 0; return; } // the end of a swipe is not a tap
      const hadMouse = !!this.mouse;
      this.mouse = { x: e.clientX, y: e.clientY }; this.updateHover(el, this.pos);
      const page = this.popupPages[this.hlKey.split(':')[1]];
      if (page) this.openPopup(page, { x: e.clientX, y: e.clientY });
      else if (!hadMouse) this.mouse = null;
    };
    // Keyboard nav: open a page with the panel growing out of its scene object
    const centres = { about: [745, 432], resume: [897, 395], experience: [428, 529], playground: [612, 490] };
    el.querySelector('[data-scene-nav]').addEventListener('click', e => {
      e.stopPropagation();
      const b = e.target.closest('[data-open]'); if (!b) return;
      const r = el.querySelector('[data-slide] > div').getBoundingClientRect(), [X, Y] = centres[b.dataset.open];
      this.openPopup(b.dataset.open, { x: r.left + X / 1456 * r.width, y: r.top + Y / 813 * r.height });
      b.parentElement.dataset.held = ''; // stay visible under the scrim so the keyboard round-trip doesn't flash
    });
    // Pop-up shell: stop every input at the overlay so the scene (season scroll, hover, swipe) never receives it.
    const pop = el.querySelector('[data-popup]');
    ['wheel', 'pointerdown', 'pointermove', 'pointerup', 'pointercancel'].forEach(ev => pop.addEventListener(ev, e => e.stopPropagation(), { passive: true }));
    pop.addEventListener('click', e => {
      e.stopPropagation();
      if (e.target.closest('a[href="#"]')) e.preventDefault(); // placeholder links: no navigation until real URLs are added
      if (e.target.closest('[data-proj-back]')) { this.closeProject(); return; }
      if (e.target.closest('[data-pg-back]')) { this.playClose(); return; }
      const proj = e.target.closest('[data-open-project]'); if (proj) { this.openProject(proj.dataset.openProject, proj); return; }
      if (e.target === pop || e.target.hasAttribute?.('data-backdrop') || e.target.closest('[data-popup-close]')) this.closePopup();
    });
    el.addEventListener('click', this.onClick);
    this.onLeave = () => { this.mouse = null; this.tipP = null; };
    el.addEventListener('pointerleave', this.onLeave);
    el.addEventListener('wheel', this.onWheel, { passive: false });
    el.addEventListener('pointerdown', this.onDown); el.addEventListener('pointermove', this.onMove);
    el.addEventListener('pointerup', this.onUp); el.addEventListener('pointercancel', this.onUp);
    window.addEventListener('keydown', this.onKey);
    const tick = () => {
      if (ty == null && Math.abs(this.panVel) > 0.1) { this.panTarget = this.clampPan(el, this.panTarget + this.panVel); this.panVel *= 0.85; }
      this.panTarget = this.clampPan(el, this.panTarget); // also re-clamps after a resize / rotation
      const np = Math.abs(this.panTarget - this.panX) < 0.05 ? this.panTarget : this.panX + (this.panTarget - this.panX) * 0.35;
      if (np !== this.panX) { this.panX = np; el.style.setProperty('--pan-x', np.toFixed(2) + 'px'); }
      if ((this.props.snap ?? true) && performance.now() - this.lastInput > 180) this.target += (Math.round(this.target) - this.target) * 0.12;
      this.pos += (this.target - this.pos) * 0.09;
      const n = 4, p = this.pos;
      this.setGlow(p);
      const t = performance.now() / 1000, A = this.props.swayAmount ?? 1;
      const cv = el.querySelector('[data-smoke]'); if (cv) this.drawSmoke(cv, t);
      this.updateHover(el, p);
      const fdt = Math.min(0.05, this.lastFT ? t - this.lastFT : 0.016); this.lastFT = t;
      this.stepFalls(el, fdt, t);
      this.stepBoats(el, fdt, t);
      this.stepSnow(el, fdt, t);
      this.stepGardener(el, fdt, t);
      if (!this.gardenDone) { this.gardenDone = true; el.querySelectorAll('[data-slide]').forEach((sl, i) => { const c = sl.querySelector('[data-garden]'); if (c) this.paintGarden(c, this.seasons[i].name); else this.gardenDone = false; }); }
      // reader fade (0.7s in / 1.2s out, smoothstep) — tinted with the boat's sampled sky colour
      const ra = this.readA = this.readA || [0, 0, 0, 0];
      el.querySelectorAll('[data-slide]').forEach((s, i) => { const cv = s.querySelector('[data-reader]'); if (!cv) return;
        ra[i] = Math.max(0, Math.min(1, ra[i] + (this.hlKey === i + ':tree' ? fdt / 0.7 : -fdt / 1.2)));
        const bs = this.boatSrc[i], col = bs ? bs.hi : [226, 234, 242];
        this.drawReader(cv, t, ra[i] * ra[i] * (3 - 2 * ra[i]), col, this.seasons[i].name); });
      // shared wind: tree rotates by it, reflection counter-rotates (boat uses the same formula)
      el.querySelectorAll('[data-slide]').forEach((s, i) => {
        const a = A * (0.7 * Math.sin(t * 1.15 + i) + 0.3 * Math.sin(t * 2.9 + i * 2.1));
        const tr = s.querySelector('[data-tree]'), rf = s.querySelector('[data-refl]');
        if (tr) tr.style.transform = `rotate(${a}deg)`;
        if (rf) rf.style.transform = `rotate(${-a}deg)`;
      });
      // season wipe
      el.querySelectorAll('[data-slide]').forEach((s, i) => {
        let d = (((i - p) % n) + n) % n; if (d > n / 2) d -= n;
        s.style.transform = 'none';
        if (d > 0 && d < 1) {
          s.style.visibility = 'visible'; s.style.zIndex = 2;
          s.style.clipPath = `inset(0 0 0 ${d * 100}%)`;
        } else if (d <= 0 && d > -1) {
          s.style.visibility = 'visible'; s.style.zIndex = 1;
          s.style.clipPath = 'none';
        } else { s.style.visibility = 'hidden'; s.style.zIndex = 0; }
      });
      this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  }
  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
    const el = this.rootRef.current;
    if (el) { el.removeEventListener('wheel', this.onWheel); el.removeEventListener('pointerdown', this.onDown); el.removeEventListener('pointermove', this.onMove); el.removeEventListener('pointerup', this.onUp); el.removeEventListener('pointercancel', this.onUp); el.removeEventListener('pointerleave', this.onLeave); el.removeEventListener('click', this.onClick); }
    window.removeEventListener('keydown', this.onKey);
  }
}

// ---- bootstrap: props = the tunables exposed as Tweaks in the prototype ----
const scene = new SeasonsScene();
scene.props = { snap: true, scrollSpeed: 3, swayAmount: 1.5 };
scene.rootRef.current = document.getElementById('root');
scene.componentDidMount();
</script>
