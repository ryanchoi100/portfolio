<!DOCTYPE html>
<!-- Seasons endless-scroll scene — standalone, dependency-free. Serve over HTTP (canvas reads image pixels; file:// will fail). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seasons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;overflow:hidden;background:var(--night-water);color:var(--lake-ink);overscroll-behavior:none}a{color:var(--lake-ink)}a:hover{color:var(--lake-ink)}</style>
<style>
/* ======================================================================
   GLASS TOKENS — extracted verbatim from the original hover label + Playground pop-up.
   Names follow DESIGN.md ("The Painted Season"); every glass surface reads these, never restated values.
   ====================================================================== */
:root {
  /* colour — names and values as in DESIGN.md frontmatter */
  --lake-ink: #141c24;                        /* all text, icons, focus outlines */
  --lake-ink-muted: rgba(20, 28, 38, 0.72);   /* secondary metadata (dates) */
  --hairline: rgba(20, 28, 38, 0.10);         /* 1px row dividers */
  --frost: rgba(255, 255, 255, 0.62);         /* standard glass: label, panel, close, buttons, chips */
  --frost-dense: rgba(255, 255, 255, 0.74);   /* glass on glass: cards, hovered rows */
  --frost-lit: rgba(255, 255, 255, 0.8);      /* hovered glass buttons (the 0.8 ceiling) */
  --frost-edge: rgba(255, 255, 255, 0.6);     /* 1px border on every glass surface */
  --dusk-scrim: rgba(20, 28, 38, 0.16);       /* wash over the scene behind a pop-up */
  --lamplight: rgba(255, 222, 156, 0.6);      /* the only accent; state responses only */
  --lamplight-selection: rgba(255, 222, 156, 0.75);
  --night-water: #1d2630;
  /* type */
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  /* shape */
  --radius-glass: 9px;
  --radius-thumb: 6px;
  /* material: the one frost filter (never animated) and the scrim filter */
  --frost-filter: blur(10px) saturate(1.4);
  --frost-border: 1px solid var(--frost-edge);
  --scrim-filter: blur(6px) brightness(0.9);
  /* elevation — DESIGN.md shadow vocabulary */
  --frost-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.35);
  --lamplight-ring: 0 0 14px var(--lamplight);
  --shadow-resting: 0 4px 14px rgba(20, 28, 38, 0.10), var(--frost-highlight);
  --shadow-lamplit: 0 4px 14px rgba(20, 28, 38, 0.10), var(--lamplight-ring), var(--frost-highlight);
  --shadow-lifted: 0 10px 24px rgba(20, 28, 38, 0.14), 0 0 18px rgba(255, 222, 156, 0.55), var(--frost-highlight);
  /* motion: expo ease-out arrivals; in-out exits (close stays visible); exits faster than entrances */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-exit: cubic-bezier(0.455, 0.03, 0.515, 0.955);
  --ease-hover: ease;
  --dur-open: 300ms;
  --dur-close: 220ms;
  --dur-reveal: 280ms;
  --stagger: 35ms;
  --dur-hover: 200ms;
  --dur-press: 120ms;
}
.glass {
  background: var(--frost);
  -webkit-backdrop-filter: var(--frost-filter); backdrop-filter: var(--frost-filter);
  border: var(--frost-border); border-radius: var(--radius-glass);
  box-shadow: var(--shadow-resting); color: var(--lake-ink);
}
.glass--dense { background: var(--frost-dense); }

/* ======================================================================
   POP-UP SHELL — one scrim + panel + close button, reused by every page.
   Pages are <template data-popup-page> blocks; only their content differs.
   States: data-state="closed" | "open" | "closing" (set by openPopup / closePopup).
   ====================================================================== */
/* The scrim is the scroller: the whole sheet (header included) scrolls inside it, from its resting
   top offset up to the top edge of the page, and its bottom always meets the bottom of the page. */
.popup {
  --panel-pad: clamp(18px, 3vw, 36px);
  --panel-top: calc((100vh - min(calc(100vh - 24px), max(70vh, calc(100vh - 30vw)))) / 2); /* where the original fixed-height panel's top sat */
  position: absolute; inset: 0; z-index: 20; display: block;
  overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y;
  scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--lake-ink) 22%, transparent) transparent;
  background: var(--dusk-scrim);
  -webkit-backdrop-filter: var(--scrim-filter); backdrop-filter: var(--scrim-filter);
  font-family: var(--font-mono); color: var(--lake-ink);
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity var(--dur-close) var(--ease-exit), visibility 0s linear var(--dur-close);
}
.popup[data-state="open"] {
  opacity: 1; visibility: visible; pointer-events: auto;
  transition: opacity var(--dur-open) var(--ease-out), visibility 0s linear 0s;
}
.popup__panel {
  position: relative; box-sizing: border-box; display: flex; flex-direction: column;
  width: max(76vw, min(calc(100vw - 24px), 560px)); max-width: 1240px;
  margin: var(--panel-top) auto 0;
  min-height: 100vh;   /* at least a full page: every sheet can scroll until it fills the page edge to edge, and its bottom always meets the page bottom */
  padding: var(--panel-pad);
  border-bottom-width: 0; border-bottom-left-radius: 0; border-bottom-right-radius: 0; /* the sheet runs off the bottom edge */
  user-select: text; cursor: default;
  transform: scale(0.96);
  transition: transform var(--dur-close) var(--ease-exit);
}
.popup[data-state="open"] .popup__panel { transform: scale(1); transition: transform var(--dur-open) var(--ease-out); }
/* zero-height sticky bar: holds the close button 12px from the sheet's top-right, then pins it 12px
   below the top of the page once the sheet scrolls past, so it is always reachable */
.popup__bar {
  position: sticky; top: 12px; z-index: 2; height: 0;
  margin-top: calc(12px - var(--panel-pad));
}
.popup__close {
  position: absolute; top: 0; right: calc(12px - var(--panel-pad)); width: 44px; height: 44px;
  display: grid; place-items: center; padding: 0;
  font-family: inherit; font-size: 18px; line-height: 1; cursor: pointer;
  transition: box-shadow var(--dur-hover) var(--ease-hover), background-color var(--dur-hover) var(--ease-hover), transform var(--dur-press) var(--ease-out);
}
.popup__close:active { transform: scale(0.94); }
.popup :focus-visible { outline: 2px solid var(--lake-ink); outline-offset: 0; }
.popup ::selection { background: var(--lamplight-selection); color: var(--lake-ink); }

/* header + scroll body: the layout every page drops its content into */
.pop-head { display: flex; flex-direction: column; gap: 8px; padding-right: 52px; }
.pop-head h2 { margin: 0; font-size: 22px; line-height: 1.1; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
.pop-head p { margin: 0; font-size: 13px; line-height: 1.5; max-width: 56ch; text-wrap: pretty; }
.pop-scroll { margin-top: 22px; padding: 4px; }   /* page body: flows in the sheet; the scrim scrolls it */

/* Playground grid + cards (unchanged look; the hover lift moves the inner surface so the hit area stays put) */
.pop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 14px; align-content: start; }
.pop-card { display: flex; color: inherit; text-decoration: none; cursor: pointer; border-radius: var(--radius-glass); }
.pop-card__surface {
  flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 10px;
  transition: transform 250ms var(--ease-out), box-shadow 250ms var(--ease-hover);
}
.pop-thumb {
  aspect-ratio: 16/10; border-radius: var(--radius-thumb); display: grid; place-items: center;
  background: radial-gradient(120% 90% at 30% 25%, rgba(255,255,255,0.35), rgba(255,255,255,0) 60%), var(--tint);
  font-size: 10px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase;
}
.pop-card__text { display: flex; flex-direction: column; gap: 4px; padding: 0 2px 2px; }
.pop-card__title { font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; }
.pop-card__caption { font-size: 12px; line-height: 1.45; text-wrap: pretty; }

/* Shared content parts for the text pages (About, Resume, Experience) */
.pop-section + .pop-section { margin-top: 30px; }
.pop-section h3 { margin: 0 0 10px; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; }
.pop-prose p { margin: 0; font-size: 13px; line-height: 1.6; max-width: 62ch; text-wrap: pretty; }
.pop-prose p + p { margin-top: 12px; }
.pop-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }

.pop-list > li + li { border-top: 1px solid var(--hairline); }   /* hairline between rows */
/* text pages: let row hover surfaces bleed 10px past the text column without being clipped by the scroller */
.pop-scroll:not(.pop-grid) { margin-inline: -10px; padding-inline: 14px; }
.pop-row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 20px; align-items: baseline;
  padding: 12px 10px; margin-inline: -10px; border: 1px solid transparent; border-radius: var(--radius-glass);
  color: inherit; text-decoration: none;
  transition: background-color var(--dur-hover) var(--ease-hover), box-shadow var(--dur-hover) var(--ease-hover), border-color var(--dur-hover) var(--ease-hover);
}
a.pop-row:focus-visible { background: var(--frost-dense); border-color: var(--frost-edge); }
.pop-row__title { font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; }
.pop-row__meta { font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--lake-ink-muted); }
.pop-row__body { grid-column: 1 / -1; font-size: 12px; line-height: 1.5; max-width: 70ch; text-wrap: pretty; }
.pop-row__go { display: inline-block; margin-left: 6px; transition: transform var(--dur-hover) var(--ease-out); }
.pop-facts { display: grid; grid-template-columns: max-content 1fr; gap: 8px 22px; margin: 0; font-size: 12px; line-height: 1.5; }
.pop-facts dt { font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; }
.pop-facts dd { margin: 0; }
.pop-about { display: grid; grid-template-columns: minmax(180px, 280px) minmax(0, 1fr); gap: clamp(20px, 3vw, 40px); align-items: start; }
.pop-portrait { aspect-ratio: 4/5; --tint: rgba(158,182,160,0.42); }
.pop-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
.pop-button {
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px; box-sizing: border-box; padding: 0 16px;
  font: inherit; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--lake-ink); text-decoration: none; cursor: pointer;
  transition: box-shadow var(--dur-hover) var(--ease-hover), background-color var(--dur-hover) var(--ease-hover), transform var(--dur-press) var(--ease-out);
}
.pop-button:active { transform: scale(0.97); }
@media (max-width: 640px) {
  .pop-about { grid-template-columns: 1fr; }
  .pop-portrait { max-width: 220px; }
  .pop-facts { grid-template-columns: 1fr; gap: 2px; }
  .pop-facts dd + dt { margin-top: 10px; }
}

/* Keyboard access to the scene objects: invisible until a key-user tabs into it, then shown as glass chips */
.scene-nav { position: absolute; top: 12px; left: 12px; z-index: 15; display: flex; flex-wrap: wrap; gap: 6px; font-family: var(--font-mono); }
.scene-nav:not(:focus-within):not([data-held]) { clip-path: inset(50%); width: 1px; height: 1px; overflow: hidden; white-space: nowrap; }
.scene-nav__item {
  min-height: 32px; padding: 0 12px; font: inherit; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer;
  transition: box-shadow var(--dur-hover) var(--ease-hover), background-color var(--dur-hover) var(--ease-hover);
}
.scene-nav__item:focus-visible { outline: 2px solid var(--lake-ink); outline-offset: 0; background: var(--frost-lit); }

/* Staggered entry: items carry data-reveal and --i (set in JS). Hidden only while closed, so closing never snaps. */
.popup[data-state="closed"] [data-reveal] { opacity: 0; transform: translateY(6px); }
.popup[data-state="open"] [data-reveal] {
  transition: opacity var(--dur-reveal) var(--ease-out), transform var(--dur-reveal) var(--ease-out);
  transition-delay: calc(60ms + min(var(--i, 0), 8) * var(--stagger));
}

/* Hover micro-interactions — pointer devices only, so touch never gets stuck hover states */
@media (hover: hover) and (pointer: fine) {
  .popup__close:hover, .pop-button:hover { background: var(--frost-lit); box-shadow: var(--shadow-lamplit); }
  .pop-card:hover .pop-card__surface { transform: translateY(-3px); box-shadow: var(--shadow-lifted); }
  .pop-row:hover { background: color-mix(in srgb, var(--frost) 65%, transparent); }   /* static rows: a faint frost tint only */
  a.pop-row:hover { background: var(--frost-dense); border-color: var(--frost-edge); box-shadow: var(--shadow-lamplit); }
  a.pop-row:hover .pop-row__go { transform: translateX(3px); }
}

/* Reduced motion: no scaling, sliding or stagger; keep a short opacity cross-fade so open/close still reads */
@media (prefers-reduced-motion: reduce) {
  .popup { transition: opacity 150ms ease, visibility 0s linear 150ms; }
  .popup[data-state="open"] { transition: opacity 150ms ease, visibility 0s linear 0s; }
  .popup__panel, .popup[data-state="open"] .popup__panel { transform: none; transition: none; }
  .popup[data-state="closed"] [data-reveal] { transform: none; }
  .popup[data-state="open"] [data-reveal] { transition: opacity 150ms ease; transition-delay: 0ms; }
  .pop-card__surface, .pop-row__go, .popup__close, .pop-button { transition-property: box-shadow, background-color; }
  .pop-card:hover .pop-card__surface, .pop-row:hover .pop-row__go { transform: none; }
  .popup__close:active, .pop-button:active { transform: none; }
}
</style>

    while (this.spawnAcc > 0.07) { this.spawnAcc -= 0.07; this.puffs.push({ x: 771, y: 364, age: 0, life: 13 + Math.random() * 3, seed: Math.random() * 6.28, j: (Math.random() - 0.5) * 2, k: 0.7 + Math.random() * 0.6, g: 0.8 + Math.random() * 0.4 }); }
    for (const p of this.puffs) {
      const u = p.age / p.life;
      p.y -= (16 - 7 * u) * dt;
      p.age += dt;
      const h = 366 - p.y;
      const f = Math.min(1, Math.max(0, (h - 15) / 70)), ff = f * f * (3 - 2 * f);
      const wave = (h * 0.14) * Math.sin(h * 0.032 - t * 0.38)
                 + (h * 0.07) * Math.sin(h * 0.075 - t * 0.62 + 1.3)
                 + (h * 0.035) * Math.sin(h * 0.14 - t * 0.9 + 2.7);
      p.x = 771 + h * 0.28 * ff + wave * ff + p.j * (0.6 + h * 0.06 * ff);
    }
    this.puffs = this.puffs.filter(p => p.age < p.life);
  }
  drawSmoke(cv, t) {
    const dt = Math.min(0.05, this.lastT ? t - this.lastT : 0.016); this.lastT = t;
    if (!this.warm) { this.warm = true; for (let i = 0; i < 300; i++) this.stepSmoke(0.06, t - 18 + i * 0.06); }
    this.stepSmoke(dt, t);
    const ctx = cv.getContext('2d'), S = 2, OX = 700, OY = 120;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.setTransform(S, 0, 0, S, -OX * S, -OY * S);
    const draw = (mirror, k) => {
      ctx.save(); ctx.beginPath();
      if (mirror) ctx.rect(OX, 706, 300, 120); else ctx.rect(OX, OY, 300, 367 - OY);
      ctx.clip();
      for (const p of this.puffs) {
        const u = p.age / p.life, r = (2.5 + 24 * Math.pow(u, 0.9)) * p.g;
        const a = k * p.k * 0.15 * Math.min(1, u / 0.04) * Math.pow(1 - u, 2.2);
        if (a < 0.002) continue;
        const y = mirror ? 1072 - p.y : p.y;
        const g = ctx.createRadialGradient(p.x, y, 0, p.x, y, r);
        g.addColorStop(0, `rgba(240,244,248,${a})`); g.addColorStop(0.45, `rgba(240,244,248,${a * 0.7})`); g.addColorStop(1, 'rgba(240,244,248,0)');
        ctx.fillStyle = g; ctx.fillRect(p.x - r, y - r, r * 2, r * 2);
      }
      ctx.restore();
    };
    draw(false, 1); draw(true, 0.4);
  }
  // ======================================================================
  // SEASON SCROLL + MAIN LOOP
  // pos/target are unbounded floats (integer = a season). Wheel and touch swipe add to target; arrow /
  // Page / Space keys step one season. After 180ms without input target eases to the nearest integer
  // (snap). pos eases toward target. Slide i is shown with a straight vertical wipe:
  // d = (i - pos) wrapped to (-2,2]; 0<d<1 → incoming slide clipped from the left by d·100%;
  // -1<d≤0 → outgoing slide underneath. Mouse drag is intentionally NOT supported.
  // ======================================================================
  pos = 0; target = 0; lastInput = 0;
  componentDidMount() {
    const el = this.rootRef.current;
    const speed = () => (this.props.scrollSpeed ?? 1) / 900;
    this.onWheel = e => { e.preventDefault(); const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY; this.target += d * (e.deltaMode === 1 ? 30 : 1) * speed(); this.lastInput = performance.now(); };
    this.onKey = e => {
      if ((e.key === ' ' || e.key === 'Enter') && e.target.closest?.('button, a')) return; // let focused controls activate
      if (this.pgOpen) { if (e.key === 'Escape') { e.preventDefault(); this.closePopup(); } else if (e.key === 'Tab') this.trapFocus(e); return; }
      if (['ArrowDown','ArrowRight','PageDown',' '].includes(e.key)) { this.target = Math.round(this.target) + 1; }
      else if (['ArrowUp','ArrowLeft','PageUp'].includes(e.key)) { this.target = Math.round(this.target) - 1; } else return;
      e.preventDefault(); this.lastInput = 0;
    };
    let ty = null;
    this.onDown = e => { if (e.pointerType !== 'touch') return; ty = e.clientY ?? 0; this.tx = e.clientX; el.setPointerCapture?.(e.pointerId); };
    this.onMove = e => {
      if (e.pointerType === 'mouse' || e.pointerType === 'pen') { this.mouse = { x: e.clientX, y: e.clientY }; return; }
      if (ty == null) return; const dy = ty - e.clientY, dx = this.tx - e.clientX; const d = Math.abs(dx) > Math.abs(dy) ? dx : dy; this.target += d * speed() * 2.2; ty = e.clientY; this.tx = e.clientX; this.lastInput = performance.now();
    };
    this.onUp = () => { ty = null; };
    // Click / tap on a scene object opens its page. The hit is resolved at the click point, so touch taps
    // (which never set this.mouse) work too; a missed tap clears the temporary point again.
    this.onClick = e => {
      const hadMouse = !!this.mouse;
      this.mouse = { x: e.clientX, y: e.clientY }; this.updateHover(el, this.pos);
      const page = this.popupPages[this.hlKey.split(':')[1]];
      if (page) this.openPopup(page, { x: e.clientX, y: e.clientY });
      else if (!hadMouse) this.mouse = null;
    };
    // Keyboard nav: open a page with the panel growing out of its scene object
    const centres = { about: [745, 432], resume: [897, 395], experience: [428, 529], playground: [612, 490] };
    el.querySelector('[data-scene-nav]').addEventListener('click', e => {
      e.stopPropagation();
      const b = e.target.closest('[data-open]'); if (!b) return;
      const r = el.querySelector('[data-slide] > div').getBoundingClientRect(), [X, Y] = centres[b.dataset.open];
      this.openPopup(b.dataset.open, { x: r.left + X / 1456 * r.width, y: r.top + Y / 813 * r.height });
      b.parentElement.dataset.held = ''; // stay visible under the scrim so the keyboard round-trip doesn't flash
    });
    // Pop-up shell: stop every input at the overlay so the scene (season scroll, hover, swipe) never receives it.
    const pop = el.querySelector('[data-popup]');
    ['wheel', 'pointerdown', 'pointermove', 'pointerup', 'pointercancel'].forEach(ev => pop.addEventListener(ev, e => e.stopPropagation(), { passive: true }));
    pop.addEventListener('click', e => {
      e.stopPropagation();
      if (e.target.closest('a[href="#"]')) e.preventDefault(); // placeholder links: no navigation until real URLs are added
      if (e.target === pop || e.target.closest('[data-popup-close]')) this.closePopup();
    });
    el.addEventListener('click', this.onClick);
    this.onLeave = () => { this.mouse = null; this.tipP = null; };
    el.addEventListener('pointerleave', this.onLeave);
    el.addEventListener('wheel', this.onWheel, { passive: false });
    el.addEventListener('pointerdown', this.onDown); el.addEventListener('pointermove', this.onMove);
    el.addEventListener('pointerup', this.onUp); el.addEventListener('pointercancel', this.onUp);
    window.addEventListener('keydown', this.onKey);
    const tick = () => {
      if ((this.props.snap ?? true) && performance.now() - this.lastInput > 180) this.target += (Math.round(this.target) - this.target) * 0.12;
      this.pos += (this.target - this.pos) * 0.09;
      const n = 4, p = this.pos;
      const t = performance.now() / 1000, A = this.props.swayAmount ?? 1;
      const cv = el.querySelector('[data-smoke]'); if (cv) this.drawSmoke(cv, t);
      this.updateHover(el, p);
      const fdt = Math.min(0.05, this.lastFT ? t - this.lastFT : 0.016); this.lastFT = t;
      this.stepFalls(el, fdt, t);
      this.stepBoats(el, fdt, t);
      this.stepSnow(el, fdt, t);
      this.stepGardener(el, fdt, t);
      if (!this.gardenDone) { this.gardenDone = true; el.querySelectorAll('[data-slide]').forEach((sl, i) => { const c = sl.querySelector('[data-garden]'); if (c) this.paintGarden(c, this.seasons[i].name); else this.gardenDone = false; }); }
      // reader fade (0.7s in / 1.2s out, smoothstep) — tinted with the boat's sampled sky colour
      const ra = this.readA = this.readA || [0, 0, 0, 0];
      el.querySelectorAll('[data-slide]').forEach((s, i) => { const cv = s.querySelector('[data-reader]'); if (!cv) return;
        ra[i] = Math.max(0, Math.min(1, ra[i] + (this.hlKey === i + ':tree' ? fdt / 0.7 : -fdt / 1.2)));
        const bs = this.boatSrc[i], col = bs ? bs.hi : [226, 234, 242];
        this.drawReader(cv, t, ra[i] * ra[i] * (3 - 2 * ra[i]), col, this.seasons[i].name); });
      // shared wind: tree rotates by it, reflection counter-rotates (boat uses the same formula)
      el.querySelectorAll('[data-slide]').forEach((s, i) => {
        const a = A * (0.7 * Math.sin(t * 1.15 + i) + 0.3 * Math.sin(t * 2.9 + i * 2.1));
        const tr = s.querySelector('[data-tree]'), rf = s.querySelector('[data-refl]');
        if (tr) tr.style.transform = `rotate(${a}deg)`;
        if (rf) rf.style.transform = `rotate(${-a}deg)`;
      });
      // season wipe
      el.querySelectorAll('[data-slide]').forEach((s, i) => {
        let d = (((i - p) % n) + n) % n; if (d > n / 2) d -= n;
        s.style.transform = 'none';
        if (d > 0 && d < 1) {
          s.style.visibility = 'visible'; s.style.zIndex = 2;
          s.style.clipPath = `inset(0 0 0 ${d * 100}%)`;
        } else if (d <= 0 && d > -1) {
          s.style.visibility = 'visible'; s.style.zIndex = 1;
          s.style.clipPath = 'none';
        } else { s.style.visibility = 'hidden'; s.style.zIndex = 0; }
      });
      this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  }
  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
    const el = this.rootRef.current;
    if (el) { el.removeEventListener('wheel', this.onWheel); el.removeEventListener('pointerdown', this.onDown); el.removeEventListener('pointermove', this.onMove); el.removeEventListener('pointerup', this.onUp); el.removeEventListener('pointercancel', this.onUp); el.removeEventListener('pointerleave', this.onLeave); el.removeEventListener('click', this.onClick); }
    window.removeEventListener('keydown', this.onKey);
  }
}

// ---- bootstrap: props = the tunables exposed as Tweaks in the prototype ----
const scene = new SeasonsScene();
scene.props = { snap: true, scrollSpeed: 3, swayAmount: 1.5 };
scene.rootRef.current = document.getElementById('root');
scene.componentDidMount();
</script>
